name: Update live public presence data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: live-public-presence-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh live JSON data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: tbm0115
          SEARCH_QUERY: '"Trais McAllister" OR "tbm0115"'
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BING_SEARCH_API_KEY: ${{ secrets.BING_SEARCH_API_KEY }}
        run: node scripts/update-live-data.mjs

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- domains.json social-media.json development.json search-results.json assets/repo-previews)" ]; then
            echo "No live data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.json social-media.json development.json search-results.json assets/repo-previews
          git commit -m "Update live public presence data"
          git push
